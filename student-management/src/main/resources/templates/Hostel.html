<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hostel Rental System - StayHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8f9fa;
    }

    header {
      background: linear-gradient(135deg, #43cea2, #185a9d);
      color: white;
      padding: 1rem 0;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    #StayHub {
      margin-left: 20px;
      font-weight: bold;
    }

    .card {
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s;
    }

    .card:hover {
      transform: scale(1.02);
    }

    .rating {
      color: #ffc107;
    }

    footer {
      background-color: #343a40;
      color: white;
      text-align: center;
      padding: 1rem;
    }

    .card-img-top {
      height: 200px;
      object-fit: cover;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <h1 id="StayHub">#StayHub</h1>
    <marquee><p class="text-light"><b>Find your perfect stay, effortlessly!</b></p></marquee>
  </header>

  <!-- Main Content -->
  <div class="container my-4">
    <!-- Search Bar -->
    <div class="input-group mb-4">
      <input type="text" id="searchInput" class="form-control" placeholder="Search hostel by name or location">
      <button class="btn btn-primary" id="searchButton">Search</button>
    </div>

    <!-- Hostel Cards -->
    <div class="row" id="hostelCards">
      <!-- Cards will be injected dynamically here -->
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>© 2025 StayHub. All rights reserved.</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Sample data for hostels
    const hostels = [
      {
        name: "Greenview Hostel",
        image: "assets/hoste_building.jpg",
        roomSize: "1RK/1BHK/2BHK",
        contact: "9876543210",
        location: "Pune-Katraj",
        rating: 4.5, // Rating out of 5
        detailsLink: "details.html?id=1"
      },
      {
        name: "BlueSky Apartments",
        image: "assets/hoste_building2.jpg",
        roomSize: "2BHK/3BHK",
        contact: "8765432109",
        location: "Pune-Hinjewadi",
        rating: 3.5, // Rating out of 5
        detailsLink: "details.html?id=2"
      },
      {
        name: "City Inn",
        image: "assets/Hostel_Buildin3.jpg",
        roomSize: "1RK",
        contact: "7654321098",
        location: "Pune-Vadgaon",
        rating: 4.0, // Rating out of 5
        detailsLink: "details.html?id=3"
      },
      {
        name: "Platinum Lodge",
        image: "assets/hoste_building4.jpg",
        roomSize: "1BHK",
        contact: "9876543210",
        location: "Pune-Narhe",
        rating: 4.8, // Rating out of 5
        detailsLink: "details.html?id=1"
      },
      {
        name: "Crown Comforts",
        image: "assets/hoste_building5.jpg",
        roomSize: "1BHK/2BHK",
        contact: "8765432109",
        location: "Pune-Wakad",
        rating: 3.8, // Rating out of 5
        detailsLink: "details.html?id=2"
      },
      {
        name: "Golden Nest",
        image: "assets/Hostelimage.png",
        roomSize: "1RK",
        contact: "7654321098",
        location: "Pune-Vadgaon",
        rating: 4.2, // Rating out of 5
        detailsLink: "details.html?id=3"
      }
    ];

    // Function to generate stars based on rating
    function generateStars(rating) {
      let stars = '';
      for (let i = 1; i <= 5; i++) {
        if (i <= rating) {
          stars += '<span class="rating">&#9733;</span>'; // Filled star
        } else {
          stars += '<span class="rating">&#9734;</span>'; // Empty star
        }
      }
      return stars;
    }

    // Inject hostel cards dynamically
    const hostelCardsContainer = document.getElementById("hostelCards");

    function displayHostels(data) {
      hostelCardsContainer.innerHTML = ""; // Clear previous results
      data.forEach(hostel => {
        const card = `
          <div class="col-md-4">
            <div class="card">
              <img src="${hostel.image}" class="card-img-top" alt="${hostel.name}" style="height: 250px;">
              <div class="card-body">
                <h5 class="card-title">${hostel.name}</h5>
                <p class="card-text">Room Size: ${hostel.roomSize}</p>
                <p class="card-text">Contact: ${hostel.contact}</p>
                <p class="card-text">Location: ${hostel.location}</p>
                <div class="mb-3">
                  <p class="card-text">Rating: ${generateStars(hostel.rating)}</p>
                </div>
                <a href="${hostel.detailsLink}" class="btn btn-primary">See Room Images</a>
              </div>
            </div>
          </div>
        `;
        hostelCardsContainer.innerHTML += card;
      });
    }

    // Initial display of all hostels
    displayHostels(hostels);

    // Search functionality
    const searchInput = document.getElementById("searchInput");
    const searchButton = document.getElementById("searchButton");

    searchButton.addEventListener("click", () => {
      const query = searchInput.value.toLowerCase();
      const filteredHostels = hostels.filter(hostel => 
        hostel.name.toLowerCase().includes(query) || 
        hostel.location.toLowerCase().includes(query)
      );
      displayHostels(filteredHostels);
    });
  </script>
</body>
</html>
