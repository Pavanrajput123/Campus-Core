<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial; padding: 40px; background: #f9f9f9; }
        form { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 10px; }
        input, button { width: 100%; padding: 10px; margin-top: 10px; border-radius: 5px; }
        button { background: #007bff; color: white; border: none; }
        button:hover { background: #0056b3; }
        .error { color: red; text-align: center; }
    </style>
</head>
<body>

<h2 style="text-align:center;">Login</h2>

<form method="post" th:action="@{/login}">
    <input type="email" name="email" placeholder="Email" required />
    <input type="password" name="password" placeholder="Password" required />
    <button type="submit">Login</button>
</form>

<p th:if="${error}" th:text="${error}" class="error"></p>

<p style="text-align:center;">Don't have an account?
    <a th:href="@{/register}">Register here</a>
</p>

</body>
</html>
